name: Purge jsDelivr CDN Cache

on:
  workflow_call:

jobs:
  purge-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait 30 minutes for jsDelivr origin sync
        run: |
          echo "Waiting 30 minutes (1800 seconds) to ensure jsDelivr has detected the release..."
          sleep 1800
          echo "Wait complete. Proceeding with purge."

      - name: Purge `combined-script.js`
        env:
          CDN_PURGE_URL: https://purge.jsdelivr.net/gh/${{ github.repository }}@latest/combined-script.js
        run: |
          echo "Purging: $CDN_PURGE_URL"
          curl --fail-with-body --silent --show-error \
            --write-out '\nHTTP %{http_code}\n' \
            "$CDN_PURGE_URL"
